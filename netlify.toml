# Netlify configuration for the Canonly landing page (static site).
[build]
  publish = "."
  # No build step — this is a hand-authored single-file static site.
  command = ""

# Sensible security headers for a public marketing page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Note: no redirect rules. Netlify serves the root-level 404.html for missing
# paths automatically, and a catch-all redirect swallows form POSTs to "/"
# (files only shadow redirects for GET requests). Learned the hard way.
