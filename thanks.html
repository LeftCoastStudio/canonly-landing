<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks — Canonly</title>
<meta name="robots" content="noindex">
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#1E2761,#232c6e);color:#fff}
  .box{max-width:560px;padding:32px}
  .logo{font-family:Georgia,serif;font-weight:700;letter-spacing:2px;font-size:22px;margin-bottom:28px}
  .logo .dot{color:#02C39A}
  .check{width:64px;height:64px;border-radius:50%;background:#02C39A;margin:0 auto 22px;
    display:flex;align-items:center;justify-content:center;font-size:30px;color:#1E2761;font-weight:700}
  h1{font-family:Georgia,serif;font-size:34px;margin:0 0 10px}
  p{color:#CADCFC;font-size:17px;margin:0 0 28px;line-height:1.6}
  a{display:inline-block;background:#02C39A;color:#1E2761;font-weight:700;
    padding:12px 22px;border-radius:8px;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">CANONLY<span class="dot">.</span></div>
    <div class="check">✓</div>
    <h1>You're on the list.</h1>
    <p>Thanks — we got your request. If you asked for the playbook, it'll hit your inbox shortly; design-partner conversations get a personal reply from Jason.</p>
    <a href="/">Back to Canonly</a>
  </div>
</body>
</html>
